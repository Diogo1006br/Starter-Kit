# Development stack: backend (Laravel), frontend (Vite), PostgreSQL, Redis.
# Every credential and port comes from .env (copy of .env.example, created by
# `make init`). No fixed container_name: COMPOSE_PROJECT_NAME namespaces
# containers, networks and volumes, so several projects can coexist.

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME in .env}-php
  env_file: .env
  environment: &php-env
    # Service names on the compose network, not localhost.
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_CLIENT: phpredis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5174},http://127.0.0.1:${FRONTEND_PORT:-5174}
  volumes:
    - ./backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
  depends_on: &php-deps
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  backend:
    <<: *php
    # --no-reload is required for PHP_CLI_SERVER_WORKERS; env comes from compose anyway.
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    environment:
      <<: *php-env
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Optional background processes: `make up-workers`.
  queue:
    <<: *php
    build: !reset null
    command: php artisan queue:work --tries=1
    profiles: [workers]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *php
    build: !reset null
    command: php artisan schedule:work
    profiles: [workers]
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./docker/node
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: ${COMPOSE_PROJECT_NAME}-node
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      # Read by the browser, so it targets the host-published backend port.
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run `make init` to generate .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run `make init` to generate .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
